<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowLab · Kanban e métricas de fluxo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script>
    // Tema (SCRUM-141): aplicado antes de a página aparecer, para não piscar.
    // A mesma regra de src/model/tema.ts: a escolha guardada ou, sem ela, o sistema.
    (function () {
      var escolha = null;
      try { escolha = localStorage.getItem('flowlab.tema'); } catch (e) { /* sem armazenamento */ }
      if (escolha !== 'claro' && escolha !== 'escuro') {
        escolha = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      }
      document.documentElement.dataset.tema = escolha;
    })();
  </script>
</head>
<body>
  <a class="saltar" href="#app">Saltar para o conteúdo</a>
  <header class="site-topo">
    <div class="site-largura site-topo__linha">
      <a href="/" class="logo" aria-label="FlowLab, página inicial">
        <span class="logo__icone" aria-hidden="true"><i></i><i></i><i></i></span>
        FlowLab
      </a>
    </div>
  </header>
  <div class="site-largura pagina">
    <main id="app" tabindex="-1"></main>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <!--
    Chat do FlowLab (SCRUM-72): o bot «Kanban Master» do BOTSchool.ai.
    O loader.js desenha o botão de chat flutuante em todas as páginas e lê a
    configuração dos atributos data-*: o canal identifica o bot publicado e o
    endpoint é a API que responde. Fica no fim do body e com async para não
    atrasar o resto do site; se o BOTSchool estiver em baixo, o site funciona
    na mesma, só sem chat.
  -->
  <script src="https://webchat-cc.ng.botschool.ai/loader.js"
          data-channel-id="01a1c1dc-a793-7671-b633-d327ab0d6e9c"
          data-endpoint="https://api-cc.ng.botschool.ai"
          async></script>
</body>
</html>
